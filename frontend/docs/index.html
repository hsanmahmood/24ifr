<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>24IFR INSTRUCTIONS</title>
  
  <!-- Base Docsify Theme -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css" />
  
  <!-- Premium Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  
  <!-- Material Symbols -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

  <style>
    :root {
      /* Theme Colors - Matching Main Application */
      --color-primary: #FACC15;
      --color-primary-dim: #b3920e;
      --color-background-dark: #000000;
      --color-surface-dark: #09090b;
      --color-surface-raised-dark: #121212;
      --color-card-bg: #111111;
      --color-border-dark: #27272a;
      --color-border-light: #3f3f46;
      
      /* Layout Rules */
      --content-max-width: 800px;
      
      /* Typography */
      --font-family: 'Inter', sans-serif;
      --code-font-family: 'JetBrains Mono', monospace;
    }

    /* Core Layout - Match Main App */
    body, html, main {
      background-color: var(--color-background-dark) !important;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-family) !important;
      color: #e4e4e7 !important;
      -webkit-font-smoothing: antialiased;
    }

    /* Remove upper sidebar navigation */
    nav.app-nav {
      display: none !important;
    }

    /* Main Sidebar Styling - Match Main App Sidebar */
    .sidebar {
      background-color: #0f0f0f !important;
      border-right: 1px solid #1a1a1a !important;
      color: #e4e4e7 !important;
      padding-top: 0 !important;
    }

    .sidebar .app-name {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #ffffff !important;
      margin: 0 !important;
      padding: 20px 16px !important;
      border-bottom: 1px solid #1a1a1a !important;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .sidebar .app-name::before {
      content: '24IFR';
      font-weight: 700;
      color: #FACC15;
    }

    .sidebar > ul {
      padding: 12px !important;
      margin: 0 !important;
    }

    .sidebar ul li {
      margin: 0 !important;
      padding: 0 !important;
    }

    .sidebar ul li a {
      color: #a1a1aa !important;
      font-weight: 500;
      font-size: 14px;
      text-decoration: none !important;
      transition: color 0.15s ease, background-color 0.15s ease;
      padding: 10px 12px !important;
      border-radius: 6px !important;
      display: block;
    }

    .sidebar ul li a:hover {
      color: #ffffff !important;
      background-color: var(--color-card-bg) !important;
    }

    .sidebar ul li.active > a {
      color: #FACC15 !important;
      font-weight: 600 !important;
      background-color: rgba(245, 197, 24, 0.08) !important;
      border-right: none !important;
    }

    .sidebar ul li ul {
      padding-left: 12px !important;
      margin-top: 4px !important;
    }

    .sidebar ul li ul li a {
      font-size: 13px;
      padding: 8px 12px !important;
    }

    /* Content Area */
    .content {
      padding-top: 40px !important;
      padding-left: 40px !important;
    }

    article.markdown-section {
      color: #e4e4e7 !important;
      font-size: 14.5px;
      line-height: 1.8;
      max-width: var(--content-max-width) !important;
    }

    /* Typography - Match Main App */
    article.markdown-section h1, 
    article.markdown-section h2, 
    article.markdown-section h3,
    article.markdown-section h4,
    article.markdown-section h5,
    article.markdown-section h6 {
      color: #ffffff !important;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.25;
    }

    article.markdown-section h1 { 
      font-size: 2rem; 
      margin-bottom: 1.5rem; 
      margin-top: 0;
    }
    article.markdown-section h2 { 
      font-size: 1.5rem; 
      margin-top: 2.5rem; 
      margin-bottom: 1rem;
      border-bottom: 1px solid #27272a !important;
      padding-bottom: 0.5rem;
    }
    article.markdown-section h3 { 
      font-size: 1.25rem; 
      margin-top: 2rem; 
      margin-bottom: 0.75rem;
    }
    article.markdown-section h4 {
      font-size: 1.1rem;
      margin-top: 1.5rem;
      margin-bottom: 0.5rem;
    }

    article.markdown-section p {
      margin: 0 0 1rem;
    }

    article.markdown-section a {
      color: #FACC15 !important;
      font-weight: 500;
      text-decoration: none;
    }

    article.markdown-section a:hover {
      text-decoration: underline;
    }

    article.markdown-section strong {
      color: #ffffff !important;
      font-weight: 600;
    }

    article.markdown-section em {
      color: #e4e4e7;
    }

    /* Lists */
    article.markdown-section ul,
    article.markdown-section ol {
      margin: 1rem 0;
      padding-left: 1.5rem;
    }

    article.markdown-section li {
      margin: 0.5rem 0;
      color: #e4e4e7;
    }

    /* Code Blocks - Match Main App */
    article.markdown-section code {
      font-family: var(--code-font-family) !important;
      background-color: #18181b !important;
      color: #f4f4f5 !important;
      padding: 3px 6px !important;
      border-radius: 4px !important;
      font-size: 0.875em !important;
    }

    article.markdown-section pre {
      background-color: #111111 !important;
      border: 1px solid #18181b !important;
      border-radius: 6px !important;
      padding: 1.2em !important;
      margin: 1.5rem 0 !important;
    }

    article.markdown-section pre code {
      background-color: transparent !important;
      padding: 0 !important;
      border-radius: 0 !important;
      color: #e4e4e7 !important;
    }

    /* Blockquotes */
    article.markdown-section blockquote {
      border-left: 3px solid #FACC15 !important;
      color: #d4d4d8 !important;
      background-color: #111111 !important;
      padding: 16px 20px !important;
      margin: 1.5rem 0 !important;
      border-radius: 0 6px 6px 0;
    }

    /* Tables - Match Main App */
    article.markdown-section table {
      width: 100% !important;
      border-collapse: collapse !important;
      margin: 2rem 0 !important;
      display: table !important;
    }

    article.markdown-section th {
      background-color: #111111 !important;
      border-bottom: 2px solid #27272a !important;
      border-top: none !important;
      border-left: none !important;
      border-right: none !important;
      color: #ffffff !important;
      font-weight: 600 !important;
      padding: 12px 16px !important;
      text-align: left;
    }

    article.markdown-section td {
      border-bottom: 1px solid #18181b !important;
      border-top: none !important;
      border-left: none !important;
      border-right: none !important;
      padding: 12px 16px !important;
      color: #e4e4e7 !important;
    }

    article.markdown-section tr:hover td {
      background-color: rgba(255, 255, 255, 0.02) !important;
    }

    /* Search Bar - Match Main App */
    .search {
      border-bottom: none !important;
      padding: 12px 16px !important;
      margin: 0 !important;
    }

    .search input {
      background-color: #111111 !important;
      border: 1px solid #18181b !important;
      border-radius: 6px !important;
      color: #ffffff !important;
      padding: 10px 12px !important;
      width: 100% !important;
      box-sizing: border-box;
      font-family: var(--font-family) !important;
      font-size: 14px;
    }

    .search input:focus {
      border-color: #FACC15 !important;
      outline: none;
    }

    .search input::placeholder {
      color: #71717a !important;
    }

    .search .clear-button { 
      color: #71717a !important; 
    }
    
    .search .clear-button:hover {
      color: #ffffff !important;
    }
    
    .search h2 { 
      display: none !important; 
    }

    .search .matching-post {
      border-bottom: 1px solid #18181b !important;
      padding: 12px !important;
    }

    .search .matching-post:hover {
      background-color: #111111 !important;
    }

    .search .matching-post a {
      color: #FACC15 !important;
    }

    .search .matching-post p {
      color: #d4d4d8 !important;
    }

    /* Scrollbar - Match Main App */
    ::-webkit-scrollbar { 
      width: 6px; 
      height: 6px; 
    }
    
    ::-webkit-scrollbar-track { 
      background: #09090b; 
    }
    
    ::-webkit-scrollbar-thumb { 
      background: #27272a; 
      border-radius: 3px; 
    }
    
    ::-webkit-scrollbar-thumb:hover { 
      background: #3f3f46; 
    }

    /* Sidebar Toggle */
    .sidebar-toggle {
      background: #0f0f0f !important;
      border: 1px solid #1a1a1a !important;
      color: #888888 !important;
      border-radius: 6px !important;
      padding: 8px !important;
    }

    .sidebar-toggle:hover {
      color: #ffffff !important;
      border-color: #27272a !important;
    }

    .sidebar-toggle-button {
      cursor: pointer;
    }

    /* Cover Page */
    .cover {
      background-color: var(--color-background-dark) !important;
    }

    .cover-main {
      color: #ffffff !important;
    }

    .cover-main h1 {
      color: #FACC15 !important;
    }

    .cover-main a {
      color: #FACC15 !important;
    }

    .cover-main p {
      color: #e4e4e7 !important;
    }

    /* Pagination */
    .pagination {
      border-top: 1px solid #1a1a1a !important;
      padding: 20px 0 !important;
      margin-top: 40px !important;
    }

    .pagination a {
      color: #888888 !important;
      text-decoration: none !important;
    }

    .pagination a:hover {
      color: #FACC15 !important;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .content {
        padding-left: 20px !important;
        padding-right: 20px !important;
      }
      
      .sidebar {
        background-color: #0f0f0f !important;
      }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: '24IFR',
      nameLink: '/',
      repo: '',
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Search documentation...',
        noData: 'No results found.',
        depth: 3,
      },
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md',
      },
      themeColor: '#FACC15',
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/zoom-image.min.js"></script>
</body>
</html>
