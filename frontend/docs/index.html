<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>24IFR INSTRUCTIONS</title>
  
  <!-- Base Docsify Theme -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css" />
  
  <!-- Premium Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <style>
    :root {
      /* Theme Saffron Accent */
      --theme-color: #FACC15;
      
      /* Layout Rules */
      --content-max-width: 800px;
      
      /* Typography */
      --font-family: 'Inter', sans-serif;
      --code-font-family: 'JetBrains Mono', monospace;
    }

    /* Core Layout Fixes */
    body, background, main, .sidebar, article.markdown-section {
      background-color: #09090b !important;
    }

    body {
      font-family: var(--font-family) !important;
      color: #e4e4e7 !important;
      -webkit-font-smoothing: antialiased;
    }

    /* Minimal Sidebar Fixes */
    .sidebar {
      border-right: 1px solid #18181b !important;
      color: #a1a1aa !important;
      padding-top: 30px;
    }

    .sidebar .app-name {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #ffffff !important;
      margin-bottom: 25px;
    }

    .sidebar ul li a {
      color: #71717a !important;
      font-weight: 400;
      font-size: 13px;
      text-decoration: none !important;
      transition: color 0.15s ease;
    }

    .sidebar ul li a:hover {
      color: #ffffff !important;
    }

    .sidebar ul li.active > a {
      color: var(--theme-color) !important;
      font-weight: 600 !important;
      border-right: none !important;
    }

    /* Markdown & Document Polish */
    .content {
      padding-top: 40px !important;
    }

    article.markdown-section {
      color: #d4d4d8 !important;
      font-size: 14.5px;
      line-height: 1.8;
      max-width: var(--content-max-width) !important;
    }

    article.markdown-section h1, 
    article.markdown-section h2, 
    article.markdown-section h3 {
      color: #ffffff !important;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    article.markdown-section h1 { font-size: 2rem; margin-bottom: 1.5rem; }
    article.markdown-section h2 { font-size: 1.4rem; margin-top: 2rem; border-bottom: none !important; }
    article.markdown-section h3 { font-size: 1.15rem; }

    article.markdown-section a {
      color: var(--theme-color) !important;
      font-weight: 500;
      text-decoration: none;
    }

    article.markdown-section a:hover {
      text-decoration: underline;
    }

    /* Code Block Architecture */
    article.markdown-section code {
      font-family: var(--code-font-family) !important;
      background-color: #18181b !important;
      color: #f4f4f5 !important;
      padding: 3px 6px !important;
      border-radius: 4px !important;
      font-size: 0.875em !important;
    }

    article.markdown-section pre {
      background-color: #111111 !important;
      border: 1px solid #18181b !important;
      border-radius: 6px !important;
      padding: 1.2em !important;
    }

    article.markdown-section pre code {
      background-color: transparent !important;
      padding: 0 !important;
      border-radius: 0 !important;
    }

    /* Blockquotes styling */
    article.markdown-section blockquote {
      border-left: 3px solid var(--theme-color) !important;
      color: #a1a1aa !important;
      background-color: #111111 !important;
      padding: 12px 20px !important;
      margin: 1.5em 0 !important;
      border-radius: 0 4px 4px 0;
    }

    /* Data Tables */
    article.markdown-section table {
      width: 100% !important;
      border-collapse: collapse !important;
      margin: 2rem 0 !important;
      display: table !important; /* Forces correct non-broken display */
    }

    article.markdown-section th {
      background-color: #111111 !important;
      border-bottom: 2px solid #27272a !important;
      border-top: none !important;
      border-left: none !important;
      border-right: none !important;
      color: #ffffff !important;
      font-weight: 600 !important;
      padding: 10px 12px !important;
    }

    article.markdown-section td {
      border-bottom: 1px solid #18181b !important;
      border-top: none !important;
      border-left: none !important;
      border-right: none !important;
      padding: 10px 12px !important;
      color: #d4d4d8 !important;
    }

    /* Minimal Search Bar Fixes */
    .search {
      border-bottom: none !important;
      padding: 10px 15px !important;
    }

    .search input {
      background-color: #111111 !important;
      border: 1px solid #18181b !important;
      border-radius: 6px !important;
      color: #ffffff !important;
      padding: 8px 12px !important;
      width: 100% !important;
      box-sizing: border-box;
    }

    .search input:focus {
      border-color: var(--theme-color) !important;
      outline: none;
    }

    .search .clear-button { color: #a1a1aa !important; }
    .search h2 { display: none !important; } /* Strips redundant text */

    /* Webkit Scrollbars */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #09090b; }
    ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #3f3f46; }

    /* Structural Cleanup */
    .sidebar-toggle {
      background: #09090b !important;
      opacity: 0.8;
      border-radius: 4px;
    }
    nav.app-nav { display: none !important; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'ATC 24 IFR',
      nameLink: '/',
      repo: '',
      loadSidebar: '_sidebar.md',
      subMaxLevel: 2,
      auto2top: true,
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Search documentation...',
        noData: 'No results found.',
        depth: 3,
      },
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md',
      },
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/zoom-image.min.js"></script>
</body>
</html>
