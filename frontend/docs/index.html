<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>24IFR INSTRUCTIONS</title>
  
  <!-- Modern Base Dark Theme -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/dark.css" />
  
  <!-- Premium Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <style>
    :root {
      /* Accent Color (Saffron/Yellow) */
      --theme-color: #FACC15;
      
      /* Layout & Backgrounds */
      --content-max-width: 800px;
      
      /* Typography */
      --font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      --code-font-family: 'JetBrains Mono', monospace;
    }

    /* Core Reset & Backgrounds */
    body {
      background-color: #09090b !important;
      color: #e4e4e7 !important;
      font-family: var(--font-family);
      -webkit-font-smoothing: antialiased;
    }

    /* Sidebar Styling - Ultra Minimal */
    .sidebar {
      background-color: #09090b !important;
      border-right: 1px solid #18181b !important;
      color: #a1a1aa !important;
      padding-top: 20px;
    }

    .sidebar .app-name {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      color: #ffffff !important;
      margin-bottom: 20px;
    }

    .sidebar ul li a {
      color: #a1a1aa !important;
      font-weight: 400;
      font-size: 14px;
      transition: color 0.15s ease;
      padding: 6px 0;
    }

    .sidebar ul li a:hover {
      color: #ffffff !important;
      text-decoration: none;
    }

    .sidebar ul li.active > a {
      color: var(--theme-color) !important;
      font-weight: 600;
    }

    /* Main Content Area */
    .content {
      padding-top: 40px;
      background-color: #09090b !important;
    }

    section.cover, main {
      background-color: #09090b !important;
    }

    /* Typography Polish */
    article.markdown-section {
      background-color: #09090b !important;
      color: #d4d4d8 !important;
      font-size: 15px;
      line-height: 1.75;
    }

    article.markdown-section h1, 
    article.markdown-section h2, 
    article.markdown-section h3 {
      color: #ffffff !important;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    article.markdown-section h1 { font-size: 2.2rem; margin-bottom: 1.5rem; }
    article.markdown-section h2 { font-size: 1.5rem; margin-top: 2rem; border-bottom: none !important; }
    article.markdown-section h3 { font-size: 1.2rem; }

    article.markdown-section a {
      color: var(--theme-color);
      font-weight: 500;
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: border-color 0.15s ease;
    }

    article.markdown-section a:hover {
      border-bottom-color: var(--theme-color);
    }

    /* Inline & Block Code Styling */
    article.markdown-section code {
      font-family: var(--code-font-family) !important;
      background-color: #18181b !important;
      color: #f4f4f5 !important;
      padding: 3px 6px;
      border-radius: 4px;
      font-size: 0.9em;
    }

    article.markdown-section pre {
      background-color: #121214 !important;
      border: 1px solid #18181b;
      border-radius: 6px;
      padding: 1em;
    }

    article.markdown-section pre code {
      background-color: transparent !important;
      padding: 0;
    }

    /* Blockquotes */
    article.markdown-section blockquote {
      border-left: 3px solid var(--theme-color) !important;
      color: #a1a1aa !important;
      background-color: #141416 !important;
      padding: 12px 20px;
      margin: 1.5em 0;
      border-radius: 0 6px 6px 0;
    }

    /* Tables */
    article.markdown-section table {
      width: 100%;
      border-collapse: collapse;
      margin: 2rem 0;
    }

    article.markdown-section th {
      background-color: #141416 !important;
      border-bottom: 2px solid #27272a !important;
      color: #ffffff;
      font-weight: 600;
      padding: 10px 12px;
      text-align: left;
    }

    article.markdown-section td {
      border-bottom: 1px solid #18181b !important;
      padding: 10px 12px;
      color: #d4d4d8;
    }

    /* Search Input Customization */
    .search {
      border-bottom: 1px solid #18181b !important;
      padding: 10px 0;
    }

    .search input {
      background-color: #141416 !important;
      border: 1px solid #27272a !important;
      border-radius: 6px !important;
      color: #ffffff !important;
      padding: 8px 12px !important;
      font-size: 13px !important;
    }

    .search input:focus {
      border-color: var(--theme-color) !important;
      outline: none;
    }

    .search .clear-button {
      color: #a1a1aa !important;
    }

    /* Custom Scrollbar for Sleek Look */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #09090b;
    }
    ::-webkit-scrollbar-thumb {
      background: #27272a;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #3f3f46;
    }

    /* UI Fixes */
    .sidebar-toggle {
      background: transparent !important;
      bottom: auto !important;
      top: 20px;
    }
    nav.app-nav { display: none; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'ATC 24 IFR',
      nameLink: '/',
      repo: '',
      loadSidebar: '_sidebar.md',
      subMaxLevel: 2,
      auto2top: true,
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Search documentation...',
        noData: 'No results found.',
        depth: 3,
      },
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md',
      },
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/zoom-image.min.js"></script>
</body>
</html>
